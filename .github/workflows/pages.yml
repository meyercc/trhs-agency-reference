# Builds the app + the Storybook catalog and publishes both to GitHub Pages.
#
#   /            the prototype app
#   /storybook/  the component catalog
#
# Nothing built is committed to the repo — the site is assembled here on every
# push to main. Requires Pages "Source" to be set to GitHub Actions
# (Settings → Pages → Build and deployment → Source: GitHub Actions).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # `npm run build` is tsc --noEmit && vite build — a type error fails the
      # deploy rather than publishing a broken site.
      - name: Build app
        working-directory: web
        run: npm run build

      - name: Build Storybook
        working-directory: web
        run: npm run build-storybook

      - name: Assemble site
        run: |
          mkdir -p _site/storybook
          cp -r web/dist/. _site/
          cp -r web/storybook-static/. _site/storybook/
          # Vite and Storybook both emit paths beginning with _ or .; without
          # this, Pages' Jekyll step would drop them.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
